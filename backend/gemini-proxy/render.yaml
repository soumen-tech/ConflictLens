# render.yaml — Render Infrastructure-as-Code for the ConflictLens Gemini Proxy
#
# Docs: https://render.com/docs/infrastructure-as-code
#
# IMPORTANT: Set GEMINI_API_KEY via the Render dashboard (Environment tab),
# NOT in this file. This file is committed to Git — never put secrets here.

services:
  - type: web
    name: conflictlens-gemini-proxy
    runtime: docker
    dockerfilePath: ./backend/gemini-proxy/Dockerfile
    dockerContext: ./backend/gemini-proxy
    region: oregon  # Free tier available in: oregon, frankfurt
    plan: free      # Upgrade to "starter" ($7/mo) to eliminate cold starts

    # Health check — Render will restart the container if this fails
    healthCheckPath: /health

    envVars:
      # PORT is set automatically by Render — do not override it here.
      # The server reads process.env.PORT, which Render injects at runtime.

      - key: FREE_SCAN_LIMIT
        value: "20"  # Adjust in the Render dashboard without redeploying

      - key: GEMINI_API_KEY
        sync: false  # sync:false = "secret" — set this in the Render dashboard
